# Repository Guardrails adapter template.
# Keep lifecycle mapping here; keep policy and implementation in the shared
# guardrail commands exposed by the repository task runner.

pre-commit:
  jobs:
    - name: fast guardrails
      run: pnpm guard:commit

pre-merge-commit:
  jobs:
    - name: merge guardrails
      run: pnpm guard:commit

pre-push:
  jobs:
    - name: push guardrails
      run: pnpm guard:push
